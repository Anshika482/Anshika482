    <rect x="30" y="118" width="97" height="22" rx="4" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.8"/><text x="79" y="133" fill="#a78bfa" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Spring Boot</text><rect x="135" y="118" width="54" height="22" rx="4" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.8"/><text x="162" y="133" fill="#a78bfa" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">React</text><rect x="197" y="118" width="54" height="22" rx="4" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.8"/><text x="224" y="133" fill="#a78bfa" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text><rect x="259" y="118" width="83" height="22" rx="4" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.8"/><text x="301" y="133" fill="#a78bfa" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Gemini AI</text><rect x="350" y="118" width="61" height="22" rx="4" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.8"/><text x="381" y="133" fill="#a78bfa" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Docker</text>
