<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Library API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#03201c"/><stop offset="100%" stop-color="#071419"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="scale(2)">
    <rect x="1" y="1" width="448" height="298" rx="14" fill="url(#bg)" stroke="url(#top)" stroke-width="1.6"/>
    <rect x="14" y="10" width="422" height="2" rx="1" fill="url(#top)" opacity="0.9"/>
    <g transform="translate(386 58)" filter="url(#gl)">
      <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1.6"/>
      <text x="-22" y="-3" fill="#34d399" font-family="'JetBrains Mono',Consolas,monospace" font-size="9" font-weight="bold">GET</text>
      <text x="-22" y="11" fill="#5eead4" font-family="'JetBrains Mono',Consolas,monospace" font-size="8">/books</text>
      <rect x="14" y="4" width="5" height="9" fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <text x="30" y="46" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="9" font-weight="bold" letter-spacing="2.5">BACKEND · REST API</text>
    <text x="30" y="80" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800">🏛️ Library API</text>
    <text x="30" y="100" fill="#d1fae5" fill-opacity="0.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">Online Library Management System</text>
    <rect x="30" y="118" width="47" height="22" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8"/><text x="53" y="133" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Java</text><rect x="85" y="118" width="97" height="22" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8"/><text x="133" y="133" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Spring Boot</text><rect x="190" y="118" width="40" height="22" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8"/><text x="210" y="133" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">JWT</text><rect x="238" y="118" width="40" height="22" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8"/><text x="257" y="133" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">JPA</text><rect x="285" y="118" width="68" height="22" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8"/><text x="319" y="133" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Swagger</text>
    <rect x="28" y="160" width="394" height="98" rx="8" fill="#000000" fill-opacity="0.22" stroke="#34d399" stroke-opacity="0.25"/>
    <rect x="28" y="160" width="3" height="98" rx="1.5" fill="#34d399"/>
    <circle cx="46" cy="178" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="-0.0s" repeatCount="indefinite"/></circle><text x="60" y="182" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5">Admin, Librarian and Member roles with JWT</text><circle cx="46" cy="199" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="-0.4s" repeatCount="indefinite"/></circle><text x="60" y="203" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5">Book CRUD with search and pagination</text><circle cx="46" cy="220" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="-0.8s" repeatCount="indefinite"/></circle><text x="60" y="224" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5">Issue / return with automatic due dates</text><circle cx="46" cy="241" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="-1.2s" repeatCount="indefinite"/></circle><text x="60" y="245" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5">Overdue fines at ₹5/day, max 3 active loans</text>
    <rect x="28" y="258" width="394" height="30" rx="8" fill="#000000" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="44" cy="273" r="4" fill="#22c55e" filter="url(#gl)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="56" y="277" fill="#34d399" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="9" font-weight="bold" letter-spacing="1.5">REST API · SWAGGER DOCS</text>
    <text x="410" y="277" fill="#d1fae5" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="9" text-anchor="end">github.com/Anshika482</text>
  </g>
</svg>
